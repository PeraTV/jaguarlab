name: Organizar downloads da versão atual
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/organize-releases.yml']
permissions:
  contents: write
concurrency:
  group: organizar-releases
  cancel-in-progress: false
jobs:
  organizar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/organize-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-visibility-before
          path: app/release/release-visibility-before.json
          if-no-files-found: ignore
          retention-days: 30
# Destaca a publicação atual no atalho releases/latest; o aviso de prévia permanece no título e no texto.
