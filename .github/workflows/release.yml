name: Publicar JAGUAR LAB Android e Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml', 'distribution/android.json', 'app/package.json']
permissions:
  contents: write
concurrency:
  group: publicar-onca3d
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publicar arquivos e canal de atualização
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
